<!-- Blog External Component Title Header -->
<div class="row mb-4 mt-5 align-items-center">
  <div class="col-12">
    <div class="d-flex align-items-center gap-3">
      <span class="fs-4 text-dark fw-extrabold tracking-tight">Últimas Notícias</span>
      <div class="flex-grow-1 border-bottom border-secondary border-opacity-10 d-none d-sm-block"></div>
      <span class="badge bg-light text-muted border px-3 py-2 rounded-pill font-monospace d-none d-sm-inline-block" style="font-size: 0.72rem; border-color: rgba(0,0,0,0.06) !important;">
        Blog Tecnológico
      </span>
    </div>
  </div>
</div>

<!-- Grid Layout for Responsive Blog Postings -->
<div class="row g-4">
  <!-- Left Side: Large Featured Article Card (Hero) -->
  <div class="col-12 col-xl-6 d-flex">
    <div class="card border-0 rounded-4 shadow-sm w-100 overflow-hidden position-relative transition-all d-flex flex-column justify-content-end" [ngClass]="{'skeleton': isLoadingPage, 'blog-card-featured': !isLoadingPage}">
      <!-- Background Image Cover -->
      <img [src]="featuredPost.image" class="featured-bg-img" alt="Featured News Image" *ngIf="!isLoadingPage">
      
      <!-- Overlay Gradient Backdrop for Readability -->
      <div class="featured-gradient-overlay position-absolute start-0 end-0 top-0 bottom-0"></div>
      
      <!-- Overlay Article Content -->
      <div class="featured-content-box position-relative p-3 p-md-5 text-white mt-auto" style="z-index: 2;" *ngIf="!isLoadingPage">
        <span class="badge bg-indigo text-uppercase tracking-wider px-3 py-1.5 mb-2 mb-md-3" style="font-size: 0.65rem; background: #6366f1;">
          {{ featuredPost.category }}
        </span>
        <h3 class="fw-extrabold leading-tight mb-2 mb-md-3 text-white blog-title-hover fs-5 fs-md-3 text-truncate-2">
          {{ featuredPost.title }}
        </h3>
        <p class="text-white-50 mb-3 mb-md-4 line-clamp-3 fs-7 fs-md-6" style="line-height: 1.5;" [innerHTML]="featuredPost.excerpt">
        </p>
        <div class="d-flex flex-column flex-sm-row align-items-start align-items-sm-center justify-content-between pt-3 border-top border-white border-opacity-10 gap-3">
          <span class="small font-monospace text-white-50" style="font-size: 0.75rem;"><i class="far fa-clock me-1.5"></i>{{ featuredPost.date }}</span>
          <a *ngIf="featuredPost.id" [routerLink]="['/news-detail', featuredPost.id]" class="btn btn-light btn-sm rounded-pill fw-bold px-3.5 py-1.5 d-flex align-items-center gap-1.5 text-uppercase cursor-pointer transition shadow-sm w-100 w-sm-auto justify-content-center" style="font-size: 0.7rem;">
            Ler Artigo Completo <i class="fas fa-arrow-right fs-8"></i>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Side: Secondary Highlights and Compact Post Grid -->
  <div class="col-12 col-xl-6">
    <div class="row g-3">
      
      <!-- Two Medium Highlight Cards -->
      <div class="col-12 col-md-6 d-flex" *ngFor="let post of mediumPosts">
        <div class="card blog-card-medium border-0 rounded-4 shadow-sm w-100 overflow-hidden transition-all d-flex flex-column" [ngClass]="{'skeleton': isLoadingPage, 'bg-white': !isLoadingPage}" style="min-height: 200px;">
          <!-- Card Thumbnail Header -->
          <div class="position-relative overflow-hidden" style="height: 140px;" *ngIf="!isLoadingPage">
            <img [src]="post.image" class="card-img-top w-100 h-100 object-fit-cover transition-transform" alt="Highlight Thumbnail">
            <span class="badge bg-blur text-white position-absolute start-3 top-3 px-2.5 py-1 rounded" style="font-size: 0.65rem; backdrop-filter: blur(8px); background: rgba(15, 23, 42, 0.65);">
              {{ post.category }}
            </span>
          </div>
          <!-- Card Content Body -->
          <div class="card-body p-3 d-flex flex-column flex-grow-1" *ngIf="!isLoadingPage">
            <h6 class="fw-bold text-dark mb-2 text-truncate-2 fs-6">
              {{ post.title }}
            </h6>
            <p class="text-muted small mb-3 line-clamp-2 flex-grow-1" style="font-size: 0.8rem; line-height: 1.4;" [innerHTML]="post.excerpt">
            </p>
            <div class="d-flex align-items-center justify-content-between mt-auto pt-2 border-top border-secondary border-opacity-10">
              <span class="small font-monospace text-muted" style="font-size: 0.68rem;"><i class="far fa-calendar me-1"></i>{{ post.date }}</span>
              <a *ngIf="post.id" [routerLink]="['/news-detail', post.id]" class="text-indigo fw-bold text-decoration-none small d-flex align-items-center gap-1 cursor-pointer" style="font-size: 0.72rem; color: #6366f1;">
                Ler Mais <i class="fas fa-chevron-right fs-8"></i>
              </a>
            </div>
          </div>
        </div>
      </div>

      <!-- Four Compact Small Grid Cards -->
      <div class="col-6 col-md-3 d-flex" *ngFor="let post of smallPosts">
        <div class="card blog-card-small border-0 rounded-4 shadow-sm w-100 overflow-hidden bg-white transition-all d-flex flex-column" [ngClass]="{'skeleton': isLoadingPage, 'bg-white': !isLoadingPage}" style="min-height: 120px; cursor: pointer;" [routerLink]="post.id ? ['/news-detail', post.id] : null">
          <!-- Thumbnail Header -->
          <div class="position-relative overflow-hidden" style="height: 80px;" *ngIf="!isLoadingPage">
            <img [src]="post.image" class="card-img-top w-100 h-100 object-fit-cover transition-transform" alt="Grid Thumbnail">
            <span class="badge text-white position-absolute start-2 top-2 px-2 py-0.5 rounded font-monospace" style="font-size: 0.55rem; background: rgba(15, 23, 42, 0.75);">
              {{ post.category }}
            </span>
          </div>
          <!-- Body details -->
          <div class="card-body p-2 p-md-2.5 d-flex flex-column flex-grow-1" *ngIf="!isLoadingPage">
            <h6 class="fw-bold text-dark mb-1 text-truncate-2" style="font-size: 0.7rem; line-height: 1.25;">
              {{ post.title }}
            </h6>
            <span class="small text-muted font-monospace d-block mt-auto" style="font-size: 0.55rem; opacity: 0.75;">{{ post.date }}</span>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
