<header class="navbar">
  <!-- Esquerda: Logo e Brand -->
  <div class="navbar__brand">
    <img src="logo.png" alt="Nexas Logo" class="navbar__logo" />
    <div class="navbar__brand-text">
      <span class="navbar__title">Nexas</span>
      <span class="navbar__subtitle">Technologies</span>
    </div>
  </div>

  <!-- Centro: Navegação -->
  <nav class="navbar__nav">
    <a routerLink="/" [routerLinkActive]="['active']" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Início
    </a>
    <a routerLink="/organizations" [routerLinkActive]="['active']" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      Organizações
    </a>
    <a routerLink="/applications" [routerLinkActive]="['active']" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      Aplicações
    </a>
  </nav>

  <!-- Direita: Perfil e Notificações -->
  <div class="navbar__actions">
    <!-- Botão de Tema -->
    <button class="icon-btn theme-toggle" aria-label="Mudar tema" (click)="toggleTheme()">
      @if (themeService.currentTheme() === 'dark') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="4.22" x2="19.78" y2="5.64"></line>
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      }
    </button>

    <button class="icon-btn" aria-label="Notificações">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
    </button>
    
    <div class="navbar__divider"></div>

    <div class="profile-menu" (click)="toggleDropdown()">
      <div class="profile-menu__avatar">{{ stateUtil.user?.name?.charAt(0)?.toUpperCase() || 'U' }}</div>
      <span class="profile-menu__name">{{ stateUtil.user?.name || 'Usuário' }}</span>
      <svg class="profile-menu__chevron" [class.open]="isDropdownOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>

      <!-- Dropdown -->
      @if (isDropdownOpen) {
        <div class="dropdown">
          <div class="dropdown__header">
            <span class="dropdown__name">{{ stateUtil.user?.name || 'Usuário' }}</span>
            <span class="dropdown__email">{{ stateUtil.user?.email || 'Nenhum email' }}</span>
          </div>
          <div class="dropdown__divider"></div>
          <button class="dropdown__item" (click)="goToAccount()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            Minha Conta
          </button>
          <button class="dropdown__item dropdown__item--danger" (click)="onLogout()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Sair
          </button>
        </div>
      }
    </div>
  </div>
</header>
