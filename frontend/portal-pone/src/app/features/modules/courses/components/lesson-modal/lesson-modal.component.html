<div class="custom-modal-backdrop lesson-backdrop animated-fade-in d-flex align-items-center justify-content-center">
  <div class="custom-modal-dialog bg-dark rounded-4 shadow-lg overflow-hidden d-flex flex-column" style="width: 90%; max-width: 600px;">
    
    <!-- Modal Header -->
    <div class="modal-header bg-dark border-bottom-0 pb-3 pt-4 px-4 rounded-top-4 position-relative overflow-hidden">
      <div class="position-absolute top-0 end-0 p-3 opacity-25">
        <i class="fas fa-play-circle text-white" style="font-size: 8rem; transform: translate(20%, -30%);"></i>
      </div>
      <div class="d-flex align-items-center gap-3">
        <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center shadow-sm flex-shrink-0" style="width: 48px; height: 48px;">
          <i class="fas fa-play-circle fs-5"></i>
        </div>
        <div>
          <h5 class="modal-title fw-bolder text-white mb-0 fs-5">{{ lessonData.id && lessonData.name !== '' ? 'Editar Aula' : 'Nova Aula' }}</h5>
          <small class="text-white-50 fw-medium d-block">Preencha os campos abaixo para configurar esta aula.</small>
        </div>
      </div>
      <button type="button" class="btn-close position-absolute top-0 end-0 mt-4 me-4" (click)="cancel()" aria-label="Close"></button>
    </div>

    <!-- Modal Body -->
    <div class="modal-body p-4 overflow-auto custom-scrollbar">
      <form [formGroup]="lessonForm" class="d-flex flex-column gap-4">
        
        <div class="form-group">
          <label class="form-label text-white-50 small fw-semibold text-uppercase">Título da Aula <span class="text-danger">*</span></label>
          <input type="text" class="form-control bg-secondary bg-opacity-10 border-0 text-white rounded-3 py-2.5 px-3" formControlName="name" placeholder="Ex: Aula 1 - Bem vindo"
                 [ngClass]="{'is-invalid': f['name'].invalid && f['name'].touched}">
        </div>

        <div class="form-group">
          <label class="form-label text-white-50 small fw-semibold text-uppercase">Descrição (Opcional)</label>
          <textarea class="form-control bg-secondary bg-opacity-10 border-0 text-white rounded-3 py-2.5 px-3 custom-scrollbar" rows="3" formControlName="description" placeholder="Resumo do conteúdo desta aula..."></textarea>
        </div>

        <div class="row g-4 mb-2">
          <div class="col-12 col-md-6">
            <div class="form-group">
              <label class="form-label text-white-50 small fw-semibold text-uppercase">ID do Vídeo (Bunny)</label>
              <input type="text" class="form-control bg-secondary bg-opacity-10 border-0 text-white rounded-3 py-2.5 px-3" formControlName="bunnyVideoId" placeholder="Ex: bcd1234...">
            </div>
          </div>
          <div class="col-12 col-md-6">
            <div class="form-group">
              <label class="form-label text-white-50 small fw-semibold text-uppercase">Duração (Segundos)</label>
              <input type="number" class="form-control bg-secondary bg-opacity-10 border-0 text-white rounded-3 py-2.5 px-3" formControlName="durationSeconds" placeholder="Ex: 600" min="0">
            </div>
          </div>
        </div>

      </form>
    </div>

    <!-- Modal Footer -->
    <div class="modal-footer bg-secondary bg-opacity-10 border-top-0 px-4 py-3 d-flex justify-content-between align-items-center">
      <button type="button" class="btn btn-white border rounded-pill px-4 fw-semibold text-white-50 shadow-sm hover-primary transition-all" (click)="cancel()">Cancelar</button>
      <button type="button" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm text-white d-flex align-items-center gap-2" (click)="save()">
        <i class="fas fa-save"></i> Salvar Aula
      </button>
    </div>

  </div>
</div>
