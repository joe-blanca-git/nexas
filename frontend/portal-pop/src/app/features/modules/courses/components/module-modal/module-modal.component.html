<div class="custom-modal-backdrop animated-fade-in d-flex align-items-center justify-content-center">
  <div class="custom-modal-dialog bg-white rounded-4 shadow-lg overflow-hidden d-flex flex-column" style="width: 90%; max-width: 800px; max-height: 90vh;">
    
    <!-- Modal Header -->
    <div class="modal-header px-4 py-3 border-bottom d-flex justify-content-between align-items-center bg-light">
      <h5 class="mb-0 fw-bold text-dark"><i class="fas fa-layer-group text-primary me-2"></i>{{ moduleData.id && moduleData.name !== '' ? 'Editar Módulo' : 'Novo Módulo' }}</h5>
      <button type="button" class="btn-close" aria-label="Close" (click)="cancel()"></button>
    </div>

    <!-- Modal Body -->
    <div class="modal-body p-4 overflow-auto custom-scrollbar">
      <form [formGroup]="moduleForm">
        
        <div class="mb-3">
          <label class="form-label fw-medium small">Nome do Módulo <span class="text-danger">*</span></label>
          <input type="text" class="form-control" formControlName="name" placeholder="Ex: Módulo 1 - Introdução"
                 [ngClass]="{'is-invalid': f['name'].invalid && f['name'].touched}">
        </div>

        <div class="row g-3 mb-4">
          <div class="col-12 col-md-6">
            <label class="form-label fw-medium small">Subtítulo</label>
            <input type="text" class="form-control" formControlName="descriptionSub" placeholder="Resumo do módulo">
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label fw-medium small">Descrição Curta</label>
            <input type="text" class="form-control" formControlName="description" placeholder="Objetivos do módulo">
          </div>
        </div>

      </form>

      <hr class="my-4">

      <!-- Seção de Aulas -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="mb-0 fw-bold text-dark"><i class="fas fa-play-circle text-muted me-2"></i>Aulas</h6>
        <button type="button" class="btn btn-sm btn-primary rounded-pill px-3" (click)="openLessonModal()">
          <i class="fas fa-plus me-1"></i> Adicionar Aula
        </button>
      </div>

      <div class="text-center py-4 bg-light rounded-3 border" *ngIf="lessons.length === 0">
        <i class="fas fa-video-slash fs-3 text-muted opacity-50 mb-2"></i>
        <p class="text-muted small mb-0">Nenhuma aula adicionada neste módulo.</p>
      </div>

      <div class="d-flex flex-column gap-2" *ngIf="lessons.length > 0">
        <div class="card border shadow-sm rounded-3" *ngFor="let lesson of lessons; let i = index">
          <div class="card-body p-2 px-3 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
              <span class="badge bg-secondary rounded-pill">{{ i + 1 }}</span>
              <div>
                <h6 class="mb-0 fw-semibold text-dark fs-6">{{ lesson.name }}</h6>
                <small class="text-muted" *ngIf="lesson.durationSeconds">{{ lesson.durationSeconds / 60 | number:'1.0-0' }} minutos</small>
              </div>
            </div>
            <div class="d-flex gap-1">
              <button type="button" class="btn btn-sm btn-light rounded-circle" (click)="moveLessonUp(i)" [disabled]="i === 0" title="Subir">
                <i class="fas fa-arrow-up text-muted" style="font-size: 0.75rem;"></i>
              </button>
              <button type="button" class="btn btn-sm btn-light rounded-circle" (click)="moveLessonDown(i)" [disabled]="i === lessons.length - 1" title="Descer">
                <i class="fas fa-arrow-down text-muted" style="font-size: 0.75rem;"></i>
              </button>
              <button type="button" class="btn btn-sm btn-light rounded-circle text-primary" (click)="openLessonModal(lesson, i)" title="Editar Aula">
                <i class="fas fa-pen" style="font-size: 0.75rem;"></i>
              </button>
              <button type="button" class="btn btn-sm btn-light rounded-circle text-danger" (click)="removeLesson(i)" title="Excluir Aula">
                <i class="fas fa-trash" style="font-size: 0.75rem;"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- Modal Footer -->
    <div class="modal-footer px-4 py-3 border-top bg-light">
      <button type="button" class="btn btn-outline-secondary rounded-pill px-4" (click)="cancel()">Cancelar</button>
      <button type="button" class="btn btn-primary rounded-pill px-4" (click)="save()">Salvar Módulo</button>
    </div>

  </div>
</div>

<!-- Modal de Aula Overlay (Sub-modal) -->
<app-lesson-modal 
  *ngIf="isLessonModalOpen" 
  [lessonData]="selectedLesson!" 
  (closeModal)="closeLessonModal()"
  (saveLessonEvent)="saveLesson($event)">
</app-lesson-modal>
