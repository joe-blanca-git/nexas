<div class="security-card">
  <div class="security-card__icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
  </div>

  <div class="security-card__content">
    <h3>Alterar senha</h3>
    <p>
      Por segurança, a senha não é alterada diretamente aqui. Enviamos um e-mail com um link
      de redefinição para <strong>{{ email || 'o seu e-mail cadastrado' }}</strong> — é só
      seguir as instruções para cadastrar uma nova senha.
    </p>

    <button
      type="button"
      class="security-card__btn"
      [disabled]="sending() || cooldown() > 0"
      (click)="requestPasswordReset()"
    >
      @if (sending()) {
        <span class="security-card__spinner"></span>
        Enviando...
      } @else if (cooldown() > 0) {
        Reenviar em {{ cooldown() }}s
      } @else {
        Enviar e-mail de redefinição
      }
    </button>
  </div>
</div>
