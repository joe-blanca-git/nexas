  <div class="card border-0 rounded-4 shadow-sm p-3 mb-3">
    <div class="row g-2 align-items-center">
      <div class="col-12 col-md-7">
        <div class="position-relative">
          <span class="position-absolute start-0 top-50 translate-middle-y ps-3 text-muted" style="font-size: 0.82rem;">
            <i class="fas fa-search"></i>
          </span>
          <input type="text"
                 class="form-control rounded-pill ps-5 bg-light border-0 shadow-none py-2"
                 placeholder="Buscar tópico, autor ou conteúdo..."
                 [(ngModel)]="searchTerm"
                 (ngModelChange)="currentPage = 1"
                 style="font-size: 0.83rem;">
        </div>
      </div>
      <div class="col-12 col-md-5">
        <select class="form-select rounded-pill bg-light border-0 shadow-none py-2"
                [(ngModel)]="selectedCategory"
                (ngModelChange)="currentPage = 1"
                style="font-size: 0.83rem;">
          <option *ngFor="let opt of categoryOptions" [value]="opt">{{ opt }}</option>
        </select>
      </div>
    </div>
  </div>


  <div class="forum-tabs d-flex gap-1 mb-4">
    <button class="forum-tab-btn rounded-pill px-4 py-2 border-0 fw-semibold"
            [class.active]="activeTab === 'forums'"
            (click)="setTab('forums')"
            style="font-size: 0.82rem;">
      <i class="fas fa-th-large me-1.5"></i> Todos os Fóruns
    </button>
    <button class="forum-tab-btn rounded-pill px-4 py-2 border-0 fw-semibold"
            [class.active]="activeTab === 'recent'"
            (click)="setTab('recent')"
            style="font-size: 0.82rem;">
      <i class="fas fa-clock me-1.5"></i> Tópicos Recentes
    </button>
    <button class="forum-tab-btn rounded-pill px-4 py-2 border-0 fw-semibold position-relative"
            [class.active]="activeTab === 'mine'"
            (click)="setTab('mine')"
            style="font-size: 0.82rem;">
      <i class="fas fa-user me-1.5"></i> Meus Tópicos
      <span class="badge rounded-pill ms-1" style="background:#6366f1; color:#fff; font-size: 0.6rem;">
        {{ myTopics.length }}
      </span>
    </button>
  </div>

  <div *ngIf="activeTab === 'forums'">

    <div class="row g-3" *ngIf="isLoading">
      <div class="col-12 col-md-6" *ngFor="let i of [1,2,3,4]">
        <div class="card border-0 rounded-4 shadow-sm p-4 skeleton-card" style="min-height: 130px;">
          <div class="d-flex gap-3 align-items-center">
            <div class="skeleton rounded-3" style="width:48px; height:48px; flex-shrink:0;"></div>
            <div class="flex-grow-1">
              <div class="skeleton skeleton-sm mb-2"></div>
              <div class="skeleton skeleton-xs"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-3" *ngIf="!isLoading">
      <div class="col-12 col-md-6" *ngFor="let cat of categories">
        <div class="card border-0 rounded-4 shadow-sm forum-category-card p-4 h-100"
             (click)="setTab('recent'); selectedCategory = cat.name">
          <div class="d-flex align-items-start gap-3">
            <div class="forum-cat-icon rounded-3 flex-shrink-0 d-flex align-items-center justify-content-center"
                 [style.background]="cat.color + '18'">
              <i class="fas" [ngClass]="cat.icon" [style.color]="cat.color" style="font-size: 1.1rem;"></i>
            </div>
            <div class="flex-grow-1 min-w-0">
              <div class="d-flex align-items-center gap-2 mb-1 flex-wrap">
                <h6 class="fw-extrabold text-dark mb-0" style="font-size: 0.9rem;">{{ cat.name }}</h6>
                <span class="badge rounded-pill px-2 py-1 fw-semibold"
                      style="background: rgba(16,185,129,0.1); color: #10b981; font-size: 0.6rem;"
                      *ngIf="cat.isRecent">
                  <i class="fas fa-circle me-1" style="font-size: 0.4rem;"></i>Ativo agora
                </span>
              </div>
              <p class="text-muted mb-2 line-clamp-2" style="font-size: 0.78rem; line-height: 1.45;">{{ cat.description }}</p>
              <div class="d-flex align-items-center gap-3 text-muted" style="font-size: 0.7rem;">
                <span><i class="fas fa-layer-group me-1"></i>{{ cat.topicCount }} tópicos</span>
                <span><i class="fas fa-users me-1"></i>{{ cat.memberCount }} membros</span>
                <span class="d-none d-sm-inline"><i class="fas fa-clock me-1"></i>{{ cat.lastActivity }}</span>
              </div>
            </div>
            <i class="fas fa-chevron-right text-muted" style="font-size: 0.75rem; margin-top: 4px;"></i>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="activeTab === 'recent' || activeTab === 'mine'">

    <div class="card border-0 rounded-4 shadow-sm overflow-hidden" *ngIf="isLoading">
      <div class="p-4">
        <div class="mb-4" *ngFor="let i of [1,2,3]">
          <div class="d-flex align-items-start gap-3">
            <div class="skeleton rounded-circle flex-shrink-0" style="width:40px; height:40px;"></div>
            <div class="flex-grow-1">
              <div class="skeleton skeleton-sm mb-2"></div>
              <div class="skeleton skeleton-xs" style="width: 55%;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card border-0 rounded-4 shadow-sm overflow-hidden" *ngIf="!isLoading">
      <div class="card-header bg-white border-bottom border-secondary border-opacity-10 px-4 py-3 d-flex align-items-center justify-content-between">
        <span class="fw-bold text-dark small">
          {{ activeTab === 'mine' ? 'Meus Tópicos' : 'Tópicos Recentes' }}
          <span class="text-muted fw-normal ms-1" style="font-size: 0.78rem;">
            ({{ filteredTopics.length }} {{ filteredTopics.length === 1 ? 'tópico' : 'tópicos' }})
          </span>
        </span>
      </div>

      <div class="text-center py-5 px-4" *ngIf="filteredTopics.length === 0">
        <div class="py-3">
          <div class="mx-auto mb-3 d-flex align-items-center justify-content-center rounded-circle"
               style="width:72px; height:72px; background: rgba(99,102,241,0.07);">
            <i class="fas fa-comments text-muted" style="font-size: 1.8rem; opacity: 0.4;"></i>
          </div>
          <h6 class="fw-bold text-dark mb-1">Nenhum tópico encontrado</h6>
          <p class="text-muted small mb-3" style="font-size: 0.82rem;">
            {{ activeTab === 'mine' ? 'Você ainda não criou nenhum tópico.' : 'Tente ajustar os filtros ou a busca.' }}
          </p>
          <button class="btn btn-dark btn-sm rounded-pill px-4 py-2" (click)="openNewTopic()">
            <i class="fas fa-plus me-1"></i> Criar Primeiro Tópico
          </button>
        </div>
      </div>

      <div class="topic-list-item px-4 py-3"
           *ngFor="let topic of paginatedTopics; let last = last"
           [class.border-bottom]="!last"
           style="border-color: rgba(0,0,0,0.04) !important;">
        <div class="d-flex align-items-start gap-3">
          <div class="author-avatar rounded-circle d-flex align-items-center justify-content-center fw-bold text-white flex-shrink-0"
               [style.background]="topic.authorColor"
               style="width: 38px; height: 38px; font-size: 0.72rem;">
            {{ topic.authorInitials }}
          </div>
          <div class="flex-grow-1 min-w-0">
            <div class="d-flex align-items-center gap-2 flex-wrap mb-1">
              <span class="fw-extrabold text-dark topic-title-link" style="font-size: 0.88rem; cursor: pointer;">
                {{ topic.title }}
              </span>
              <span class="badge rounded-pill px-2 py-1 fw-semibold" [ngClass]="getStatusBadgeClass(topic.status)" style="font-size: 0.62rem;">
                <i class="fas me-1" [ngClass]="getStatusIcon(topic.status)" style="font-size: 0.55rem;"></i>
                {{ topic.status }}
              </span>
              <span class="badge rounded-pill px-2 py-1 fw-bold"
                    style="background: rgba(99,102,241,0.1); color: #6366f1; font-size: 0.6rem;"
                    *ngIf="topic.isUnread">
                Novo
              </span>
            </div>
            <p class="text-muted mb-2 line-clamp-1" style="font-size: 0.78rem; line-height: 1.45;">{{ topic.preview }}</p>
            <div class="d-flex align-items-center gap-3 flex-wrap" style="font-size: 0.7rem;">
              <span class="text-muted">
                <i class="fas fa-user me-1"></i>{{ topic.authorName }}
              </span>
              <span class="badge rounded-pill px-2 py-1 fw-semibold"
                    style="background: rgba(0,0,0,0.04); color: #64748b; font-size: 0.62rem;">
                {{ topic.categoryName }}
              </span>
              <span class="text-muted"><i class="fas fa-reply me-1"></i>{{ topic.replyCount }} respostas</span>
              <span class="text-muted"><i class="fas fa-eye me-1"></i>{{ topic.viewCount }} views</span>
              <span class="text-muted"><i class="fas fa-clock me-1"></i>{{ topic.date }}</span>
              <span class="text-warning fw-semibold" *ngIf="topic.hasPendingReplies" style="font-size: 0.7rem;">
                <i class="fas fa-exclamation-circle me-1"></i>Resposta pendente
              </span>
            </div>
          </div>
        </div>
      </div>

      <div class="card-footer bg-white border-top border-secondary border-opacity-10 px-4 py-3 d-flex align-items-center justify-content-between"
           *ngIf="totalPages > 1">
        <span class="text-muted" style="font-size: 0.78rem;">Página {{ currentPage }} de {{ totalPages }}</span>
        <div class="d-flex gap-1">
          <button class="btn btn-sm rounded-3 border-0 pagination-btn" [disabled]="currentPage === 1" (click)="setPage(currentPage - 1)">
            <i class="fas fa-chevron-left"></i>
          </button>
          <button class="btn btn-sm rounded-3 border-0 pagination-btn" *ngFor="let p of pages"
                  [class.active-page]="p === currentPage" (click)="setPage(p)">{{ p }}</button>
          <button class="btn btn-sm rounded-3 border-0 pagination-btn" [disabled]="currentPage === totalPages" (click)="setPage(currentPage + 1)">
            <i class="fas fa-chevron-right"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

</div>

  <div class="custom-modal-box rounded-5 bg-white p-4 shadow-2xl animate-scale-up"
