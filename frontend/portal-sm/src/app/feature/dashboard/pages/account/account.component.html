<div class="account-layout">
  <app-navbar></app-navbar>

  <main class="account-main">
    <div class="account-header">
      <h1>Minha Conta</h1>
      <p>Gerencie suas informações, segurança e preferências.</p>
    </div>

    <div class="account-body">
      <nav class="account-tabs">
        <button
          class="account-tabs__item"
          [class.active]="activeTab() === 'perfil'"
          (click)="selectTab('perfil')"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          Perfil
        </button>

        <button
          class="account-tabs__item"
          [class.active]="activeTab() === 'seguranca'"
          (click)="selectTab('seguranca')"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          Segurança
        </button>

        <button
          class="account-tabs__item"
          [class.active]="activeTab() === 'privacidade'"
          (click)="selectTab('privacidade')"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.62 21.62 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
          Privacidade
        </button>

        <button
          class="account-tabs__item"
          [class.active]="activeTab() === 'pagamento'"
          (click)="selectTab('pagamento')"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
            <line x1="1" y1="10" x2="23" y2="10"></line>
          </svg>
          Pagamento
        </button>
      </nav>

      <section class="account-content">
        @switch (activeTab()) {
          @case ('perfil') {
            <app-profile-tab></app-profile-tab>
          }
          @case ('seguranca') {
            <app-security-tab></app-security-tab>
          }
          @case ('privacidade') {
            <app-privacy-tab></app-privacy-tab>
          }
          @case ('pagamento') {
            <p>Página em construção. Em breve você poderá gerenciar formas de pagamento aqui.</p>
          }
        }
      </section>
    </div>
  </main>

  <app-footer></app-footer>
</div>
