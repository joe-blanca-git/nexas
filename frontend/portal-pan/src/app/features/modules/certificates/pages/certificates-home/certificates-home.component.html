<div class="animated-fade-in">
  <div class="row mb-4 align-items-center">
    <div class="col-12 col-md-8">
   
    </div>
    <div class="col-12 col-md-4 mt-3 mt-md-0 d-flex justify-content-md-end">
      <div class="position-relative w-100 search-wrapper">
        <span class="position-absolute start-0 top-50 translate-middle-y ps-3 text-muted search-icon-align">
          <i class="fas fa-search"></i>
        </span>
        <input type="text" class="form-control rounded-pill ps-5 bg-white border shadow-sm py-2"
          placeholder="Buscar pelo curso..." [(ngModel)]="searchTerm"
          style="font-size: 0.85rem; border-color: rgba(0,0,0,0.06) !important;">
      </div>
    </div>
  </div>

  <!-- Skeleton Stats -->
  <div class="row g-3 mb-5" *ngIf="isLoading">
    <div class="col-12 col-md-6 col-lg-4" *ngFor="let i of [1,2]">
      <div class="card border-0 rounded-4 shadow-sm p-4 h-100 d-flex flex-row align-items-center">
        <div class="skeleton skeleton-avatar flex-shrink-0" style="width: 48px; height: 48px;"></div>
        <div class="ms-3 w-100">
          <div class="skeleton skeleton-xs mb-2" style="width: 60%;"></div>
          <div class="skeleton skeleton-sm" style="width: 30%;"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-3 mb-5" *ngIf="!isLoading">
    <div class="col-12 col-md-6 col-lg-4">
      <div class="stat-card-clean">
        <div class="stat-icon bg-indigo-light">
          <i class="fas fa-award"></i>
        </div>
        <div class="stat-info d-flex justify-content-between align-items-center w-100">
          <span class="stat-label">Total de Certificados</span>
          <span class="stat-value">{{ totalCertificates }}</span>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-6 col-lg-4">
      <div class="stat-card-clean">
        <div class="stat-icon bg-emerald-light">
          <i class="fas fa-clock"></i>
        </div>
        <div class="stat-info d-flex justify-content-between align-items-center w-100">
          <span class="stat-label">Horas Acumuladas</span>
          <span class="stat-value">{{ totalHours }}h</span>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <!-- Skeletons Certificates Grid -->
    <ng-container *ngIf="isLoading">
      <div class="col-12 col-md-6 col-lg-4 d-flex" *ngFor="let i of [1,2,3,4,5,6]">
        <div class="card h-100 border-0 rounded-4 shadow-sm overflow-hidden bg-white w-100 d-flex flex-column">
          <div class="skeleton rounded-0" style="height: 160px;"></div>
          <div class="card-body p-4 d-flex flex-column flex-grow-1 justify-content-between">
            <div>
              <div class="d-flex align-items-center justify-content-between mb-3">
                <div class="skeleton skeleton-sm w-50"></div>
                <div class="skeleton skeleton-sm w-25"></div>
              </div>
              <div class="skeleton skeleton-md mb-2"></div>
              <div class="skeleton skeleton-text"></div>
            </div>
            <div class="pt-3 border-top border-secondary border-opacity-10 mt-3">
              <div class="d-flex justify-content-between align-items-center">
                <div class="skeleton skeleton-sm w-25"></div>
                <div class="skeleton rounded-pill py-3 px-4 w-25"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </ng-container>

    <!-- Empty State -->
    <div class="col-12 text-center py-5" *ngIf="!isLoading && filteredCertificates.length === 0">
      <div class="py-4">
        <i class="fas fa-search-minus text-muted mb-3" style="font-size: 3rem; opacity: 0.35;"></i>
        <h5 class="fw-bold text-dark">Nenhum certificado encontrado</h5>
        <p class="text-muted small">Tente ajustar seus termos de pesquisa.</p>
        <button class="btn btn-outline-dark btn-sm rounded-pill px-4 mt-2" (click)="searchTerm = ''">
          Limpar Filtro
        </button>
      </div>
    </div>

    <!-- Real Content -->
    <ng-container *ngIf="!isLoading">
      <div class="col-12 col-md-6 col-lg-4 d-flex" *ngFor="let cert of filteredCertificates">
        <div
          class="card h-100 border-0 rounded-4 shadow-sm overflow-hidden course-interactive-card bg-white w-100 d-flex flex-column transition-all"
          (click)="viewCertificate(cert.hash)">

          <div class="position-relative certificate-cover">
          <img *ngIf="cert.coverImage" [src]="cert.coverImage" class="position-absolute w-100 h-100" style="object-fit: cover; top: 0; left: 0; z-index: 0;">
          <div *ngIf="cert.coverImage" class="position-absolute w-100 h-100" style="background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.8)); top: 0; left: 0; z-index: 1;"></div>
          
          <div class="bg-pattern position-relative" *ngIf="!cert.coverImage" style="z-index: 2;"></div>
          <i class="fas fa-certificate certificate-watermark position-relative" *ngIf="!cert.coverImage" style="z-index: 2;"></i>

          <span class="badge position-absolute start-3 top-3 px-3 py-1.5 rounded-pill shadow-sm"
            style="background-color: #10b981; font-size: 0.65rem; font-weight: 600; color: #ffffff; z-index: 3;">
            <i class="fas fa-check-circle me-1"></i> {{ cert.status }}
          </span>
        </div>

        <div class="card-body p-4 d-flex flex-column flex-grow-1 justify-content-between">
          <div>
            <div class="d-flex align-items-center justify-content-between mb-2">
              <span class="font-monospace text-muted small" style="font-size: 0.68rem; letter-spacing: 0.02rem;">
                <i class="fas fa-calendar-alt me-1"></i> {{ cert.completionDate }}
              </span>
              <div class="d-flex align-items-center gap-1 small text-muted" style="font-size: 0.72rem;">
                <i class="fas fa-clock text-indigo-500" style="color: #6366f1;"></i>
                <span class="fw-bold text-dark">{{ cert.workload }}h</span>
              </div>
            </div>

            <h5 class="fw-extrabold text-dark mb-2 course-title-hover line-clamp-2"
              style="font-size: 0.98rem; line-height: 1.35; height: 2.6rem;">
              {{ cert.courseName }}
            </h5>

            <p class="text-muted small mb-4" style="font-size: 0.72rem; font-family: monospace;">
              ID: {{ cert.hash }}
            </p>
          </div>

          <div>
            <div class="pt-3 border-top border-secondary border-opacity-10">
              <div class="d-flex justify-content-between align-items-center pt-1">
                <a class="btn btn-link text-decoration-none text-muted fw-bold p-0 d-flex align-items-center gap-1.5 transition active-hover-link"
                  style="font-size: 0.72rem;" (click)="viewCertificate(cert.hash); $event.stopPropagation()">
                  <i class="fas fa-eye fs-8"></i>&nbsp; Visualizar
                </a>

                <button
                  class="btn btn-sm btn-primary rounded-pill px-3 py-1 fw-bold d-flex align-items-center gap-1 shadow-sm"
                  style="font-size: 0.72rem; background-color: #6366f1; border-color: #6366f1;"
                  (click)="downloadPdf(cert.hash); $event.stopPropagation()">
                  <i class="fas fa-file-pdf"></i> PDF
                </button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
    </ng-container>
  </div>
</div>
