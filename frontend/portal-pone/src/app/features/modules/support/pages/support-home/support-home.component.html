<div class="container-fluid py-4 d-flex flex-column" style="height: calc(90vh - 80px);">

  <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-0 flex-grow-1 d-flex flex-column" style="min-height: 0;">
    <div class="card-header bg-white border-bottom-0 pt-4 px-4 pb-0">
      <ul class="nav nav-tabs card-header-tabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link fw-semibold" [class.active]="activeTab === 'tickets'" (click)="switchTab('tickets')" type="button" role="tab">Chamados</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link fw-semibold" [class.active]="activeTab === 'forum'" (click)="switchTab('forum')" type="button" role="tab">Fóruns</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link fw-semibold" [class.active]="activeTab === 'access'" (click)="switchTab('access')" type="button" role="tab">Acesso</button>
        </li>
      </ul>
    </div>
    
    <div class="card-body p-4 bg-light bg-opacity-50 flex-grow-1 d-flex flex-column overflow-auto custom-scrollbar" style="min-height: 0;">
      
      <!-- HEADER DINÂMICO DA ABA -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="fw-bold mb-0">
          {{ activeTab === 'tickets' ? 'Caixa de Entrada de Chamados' : activeTab === 'forum' ? 'Fóruns da Comunidade' : 'Controle de Acessos' }}
        </h5>
      </div>

      <app-support-tickets [class.d-none]="activeTab !== 'tickets'" class="flex-grow-1 d-flex flex-column overflow-hidden" style="min-height: 0;"></app-support-tickets>
      <app-support-forum [class.d-none]="activeTab !== 'forum'" class="flex-grow-1 d-flex flex-column overflow-hidden" style="min-height: 0;"></app-support-forum>
      <app-support-access [class.d-none]="activeTab !== 'access'" class="flex-grow-1 d-flex flex-column overflow-hidden" style="min-height: 0;"></app-support-access>
    </div>
  </div>
</div>
